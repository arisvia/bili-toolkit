name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建产物
        run: npm run build

      - name: 单元测试
        run: npm test

      - name: 色彩对比度检查
        run: npm run check:contrast

      # 打真实 B 站 API，确认签名与端点契约没有漂移。
      # 只读公开接口，不携带任何 Cookie。
      - name: 线上契约校验
        run: npm run verify:online
        continue-on-error: true
      - name: 产物校验与打包
        run: npm run release

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: bili-toolkit-node${{ matrix.node }}
          path: dist/*.user.js
          if-no-files-found: error

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run release

      - name: 提取版本更新日志
        run: node tools/extract-changelog.mjs "${{ github.ref_name }}" > dist/release-notes.md

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.user.js
          make_latest: true
          generate_release_notes: false
          body_path: dist/release-notes.md