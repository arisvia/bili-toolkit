name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建产物
        run: npm run build

      - name: 单元测试
        run: npm test

      - name: 色彩对比度检查
        run: npm run check:contrast

      # 打真实 B 站 API，确认签名与端点契约没有漂移。
      # 只读公开接口，不携带任何 Cookie。
      - name: 线上契约校验
        run: npm run verify:online
        continue-on-error: true
      - name: 产物校验与打包
        run: npm run release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bili-toolkit-node${{ matrix.node }}
          path: dist/*.user.js
          if-no-files-found: error

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run release

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.user.js
          make_latest: true
          generate_release_notes: false
          body: |
            ### B站 · 会员权益借用 (bili-toolkit) ${{ github.ref_name }}

            - **多账号权益借用**：以主账号浏览互动，用已开通大会员的副账号获取播放地址，解锁 4K/8K/HDR/杜比/高码率与大会员专享内容。
            - **一键切换与浏览器登录**：支持通过 `GM.cookie` 一键将池内账号应用为当前浏览器登录态，页面自动无缝刷新。
            - **扫码一键添加入池**：内置本地矢量二维码渲染，手机扫码即可免复制自动归档入池。
            - **硬件编码偏好重排**：自选 AV1 / HEVC / AVC / 自动最高优先级流。

            **完整变更历史**：https://github.com/arisvia/bili-toolkit/commits/${{ github.ref_name }}