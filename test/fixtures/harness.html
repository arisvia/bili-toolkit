<p>页面内容</p>
<script>
window.__errors = [];
window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => window.__errors.push('rej: ' + String(e.reason && (e.reason.stack || e.reason))));
window.__msgs = [];
window.addEventListener('message', (e) => window.__msgs.push(e.data));
window.__GM = {
  'b.cookie': 'SESSDATA=b-secret; DedeUserID=999; bili_jct=b-csrf; buvid3=b-dev3',
  'b.lastAccount': { mid: '999', uname: '测试会员号', vipStatus: 1, vipType: 2, at: Date.now() }
};
window.GM_getValue = (k, d) => (k in window.__GM ? window.__GM[k] : d);
window.GM_setValue = (k, v) => { window.__GM[k] = v; };
window.GM_deleteValue = (k) => { delete window.__GM[k]; };
window.GM_registerMenuCommand = () => {};
window.GM_notification = () => {};
// 切号能力：模拟 GM.cookie（写进 window.__bcCookies）
window.__bcCookies = new Map();
window.GM = {
  cookie: {
    set(d, cb) {
      window.__bcCookies.set(d.name, { value: d.value, httpOnly: !!d.httpOnly });
      if (cb) cb();
    },
    delete(d, cb) { window.__bcCookies.delete(d.name); if (cb) cb(); },
    list(d, cb) { cb([...window.__bcCookies].map(([name, v]) => ({ name, value: v.value })), null); }
  }
};
window.confirm = () => true;
window.prompt = () => '改名后的号';

// 切号成功后会 location.reload()。window.location 在主世界是不可配置的
// （[Unforgeable]），没法替换 reload 本身，所以改用另一条路：
// 拦掉长延时定时器。面板里唯一的长延时就是切号后那次 1200ms 刷新，
// 其余（解析防抖 260ms、钩子轮询 1200ms/30s）都在各自的沙箱里，不受影响。
// 真刷新一次，__results 就被清空，后面所有断言都无从谈起。
window.__reloadScheduled = 0;
const nativeSetTimeout = window.setTimeout.bind(window);
// 面板切号后那次刷新是唯一的 1200ms 定时器（index.js 的启动提示用 1500，不受影响）
window.setTimeout = function (fn, ms, ...rest) {
  if (ms === 1200) { window.__reloadScheduled++; return 0; }
  return nativeSetTimeout(fn, ms, ...rest);
};
// 下面的断言自己要用定时器，走未被拦截的原版
const sleep = (ms) => new Promise(r => nativeSetTimeout(r, ms));
window.__reqs = [];
window.GM_xmlhttpRequest = (o) => {
  window.__reqs.push({ url: o.url, cookie: o.cookie });
  let res = null;
  if (o.url.includes('wbi/img')) res = { code: 0, data: { img_url: 'https://x/7cd084941338484aae1ad9425b84077c.png', sub_url: 'https://x/4932caff0ff746eab6f01bf08b70ac45.png' } };
  else if (o.url.includes('/x/web-interface/nav')) res = { code: 0, data: { mid: 999, uname: '测试会员号', vipStatus: 1, vipType: 2 } };
  else if (o.url.includes('playurl')) res = { code: 0, data: { quality: 127, accept_quality: [127,120,116,80], support_formats: [{quality:127},{quality:120},{quality:116},{quality:80}], dash: { video: [{id:127,codecid:7,bandwidth:18000000,width:3840,height:2160,frameRate:"60.000"},{id:120,codecid:12,bandwidth:12000000,width:1920,height:1080,frameRate:"60.000"}], audio: [{id:30280,bandwidth:192000}] } } };
  setTimeout(() => res ? o.onload({status:200,statusText:'OK',responseText:JSON.stringify(res),responseHeaders:'content-type: application/json'}) : o.onerror({status:404}), 5);
};
window.__nativeFetch = window.fetch;
window.__nativeSend = XMLHttpRequest.prototype.send;
window.__INITIAL_STATE__ = { videoData: { bvid: 'BV1test', cid: 42 }, user: { vipStatus: 0 } };
</script>

<script>
window.__results = [];
const SAMPLE_TSV = [
  'SESSDATA\tsample-sessdata-value-'.padEnd(222,'z') + '\t.bilibili.com\t/\t2027-10-09T05:56:45.000Z\t225\t\u2713\t\u2713\tNone\t\t\tMedium',
  'bili_jct\tsample-jct-value\t.bilibili.com\t/\t2027-10-09T05:56:45.000Z\t35\t\t\u2713\tNone\t\t\tMedium',
  'DedeUserID\t123456\t.bilibili.com\t/\t2027-04-06T02:48:35.000Z\t16\t\t\u2713\tNone\t\t\tMedium',
  'buvid3\tsample-buvid3-value-abcdef\t.bilibili.com\t/\t2026-04-06T02:48:35.000Z\t49\t\t\t\t\t\tMedium',
  'buvid4\tsample-buvid4-value\t.bilibili.com\t/\t2026-04-06T02:48:35.000Z\t118\t\t\t\t\t\tMedium',
  'bili_ticket\tsample-ticket\t.bilibili.com\t/\t2026-10-09T05:56:45.000Z\t159\t\t\t\t\t\tMedium',
  'sid\tsample-sid\t.bilibili.com\t/\t2026-10-09T05:56:45.000Z\t11\t\t\u2713\tNone\t\t\tMedium',

].join('\n');

const chk = (n, c, x) => window.__results.push({ n, ok: !!c, x: c ? undefined : x });
(async () => {
  await sleep(400);
  chk('无错误', window.__errors.length === 0, window.__errors);
  const p = document.getElementById('__BILI_VIP__-panel');
  chk('面板已挂载', !!p);
  chk('旧徽标已移除', !document.getElementById('__BILI_VIP__-badge'));
  chk('面板标题取自 meta', p.querySelector('.title').textContent.includes('会员权益借用'), p.querySelector('.title').textContent);
  chk('自定义滚动条样式已注入', !!document.getElementById('__BILI_VIP__-panel-css'));
  const css = getComputedStyle(p.querySelector('.panel'));
  chk('滚动条为细样式', css.scrollbarWidth === 'thin', css.scrollbarWidth);
  const ta = p.querySelector('textarea');
  chk('输入框有聚焦光环', getComputedStyle(ta).transition.includes('box-shadow'));
  p.querySelector('.dot').click();
  await sleep(80);
  chk('面板可展开', p.querySelector('.panel').classList.contains('show'));
  // 上界跟着 CSS 的 max-height 走（min(78vh, 620px)），账号池多占的那段靠内部滚动
  chk('展开后高度合理', p.querySelector('.panel').offsetHeight > 200 && p.querySelector('.panel').offsetHeight <= 621);

  // 账号池区块定位一次就够：面板重绘不重建 section 本身，只换里面的卡片
  const poolSec = [...p.querySelectorAll('.sec')].find(s => s.querySelector('.lbl') && s.querySelector('.lbl').textContent === '账号池');
  const addSec = [...p.querySelectorAll('.sec')].find(s => s.querySelector('.lbl') && s.querySelector('.lbl').textContent === '添加账号');

  // 区块顺序：输入在前、结果在后。第一次打开的人看到的是输入框，而不是空池子的报错文案。
  {
    const secs = [...p.querySelectorAll('.sec')].filter(s => s.querySelector('.lbl'));
    const iAdd = secs.indexOf(addSec);
    const iPool = secs.indexOf(poolSec);
    chk('「添加账号」排在「账号池」之前', iAdd >= 0 && iPool >= 0 && iAdd < iPool, { add: iAdd, pool: iPool });
    chk('两个区块都存在', !!addSec && !!poolSec);
  }

  // ---- 账号池（旧单账号数据应被迁移进来）----
  {
    const pool = window.__GM['b.accounts'];
    chk('旧单账号已迁移成账号池', !!pool && Array.isArray(pool.accounts) && pool.accounts.length === 1, pool && pool.accounts.length);
    chk('迁移后带上了昵称与会员标记', pool.accounts[0].uname === '测试会员号' && pool.accounts[0].vipStatus === 1, pool.accounts[0]);
    const panelTxt = p.querySelector('.panel').textContent;
    chk('池子渲染出账号名', panelTxt.includes('测试会员号'), panelTxt.slice(0, 160));
    chk('大会员标记可见', panelTxt.includes('大会员'));
    chk('登录中标记可见', panelTxt.includes('登录中'));
    chk('借用中标记可见', panelTxt.includes('借用中'));
    // 当前号既是登录号又是借用源，所以不显示「切到此号 / 用它借用」
    chk('当前唯一账号不显示切号按钮', !panelTxt.includes('切到此号'));
    chk('重探 / 改名 / 移除 可用', panelTxt.includes('重探') && panelTxt.includes('改名') && panelTxt.includes('移除'));
    // 脱敏安全：池子区绝对不包含未脱敏的 SESSDATA 原文
    chk('池子区不含完整 SESSDATA', !poolSec.textContent.includes('b-secret'));
  }
  // 触发一次播放，验证实时状态
  try {
    await window.fetch('https://api.bilibili.com/x/player/wbi/playurl?bvid=BV1test&cid=42&qn=32');
  } catch (e) {
    window.__errors.push('fetch: ' + String(e));
  }
  await sleep(1200);
  const hero = p.querySelector('.hero .q').textContent;
  chk('实时显示 8K 画质', hero === '8K', hero);
  const liveTxt = p.querySelector('#__BILI_VIP__-panel-live').textContent;
  chk('显示分辨率 3840×2160', liveTxt.includes('3840×2160'), liveTxt.slice(0,120));
  chk('显示码率', liveTxt.includes('18000 kbps'), liveTxt.slice(0,160));
  chk('显示可选档位', liveTxt.includes('8K') && liveTxt.includes('4K'), liveTxt.slice(0,200));
  // 区域切换
  const segs = Array.from(p.querySelectorAll('.seg'));
  const regionSeg = segs.find(s => Array.from(s.children).some(c => c.textContent === '港澳台'));
  regionSeg.querySelectorAll('button')[1].click();
  chk('区域已存为 hkmo', window.__GM['b.region'] === 'hkmo', window.__GM['b.region']);
  // 画质切换
  const qSeg = segs.find(s => Array.from(s.children).some(c => c.textContent === '4K'));
  qSeg.querySelectorAll('button')[1].click();
  chk('画质已存为 uhd', window.__GM['b.quality'] === 'uhd', window.__GM['b.quality']);
  // 开关
  const swSeg = segs.find(s => Array.from(s.children).some(c => c.textContent === '停用'));
  swSeg.querySelectorAll('button')[1].click();
  chk('已停用', window.__GM['b.enabled'] === false);

  
  // ---- Cookie 解析（面板内）----
  // 关键：解析是防抖的（260ms），且预设点击后 ta.value 才更新，
  // 所以这里统一在最后一次性断言，之前那版因为时序不对全挂了。
  // 凭证可选：有就读真实的，没有就用内置样例（保证他人克隆后也能跑）
  let tsv = SAMPLE_TSV;
  let hasCred = false;
  try {
    const r = await fetch('../../credentials/A.txt');
    if (r.ok) { tsv = await r.text(); hasCred = true; }
  } catch (e) { /* 用样例 */ }
  if (!hasCred) chk('（无凭证文件，跳过真实数据断言，使用内置样例）', true);
  const ckTa = p.querySelector('textarea');
  ckTa.value = tsv;
  ckTa.dispatchEvent(new Event('input', { bubbles: true }));
  await sleep(900);

  const ckBox = [...p.querySelectorAll('div')].find(d => d.style.maxHeight === '168px');
  chk('粘贴 DevTools 原始 TSV 后出现字段清单', !!ckBox && ckBox.style.display !== 'none');
  const ckRows = ckBox ? ckBox.querySelectorAll('label') : [];
  chk('列出全部字段', ckRows.length === (hasCred ? 23 : 8), ckRows.length);
  const ckLabels = [...ckRows].map(r => r.textContent);
  chk('SESSDATA 标记为必需', ckLabels.some(l => l.includes('SESSDATA') && l.includes('必需')));
  chk('bili_jct 标记为番剧必需', ckLabels.some(l => l.includes('bili_jct') && l.includes('番剧必需')));
  chk('sid 标记为切号必需（不再是「别混用」）', ckLabels.some(l => l.startsWith('sid') && l.includes('切号必需')), ckLabels.filter(l => l.startsWith('sid')));
  chk('buvid3 标记为浏览器自带', ckLabels.some(l => l.includes('buvid3') && l.includes('浏览器自带')));
  chk('设备字段区有「不用选」的说明', ckBox.textContent.includes('设备字段实测对接口无影响'), ckBox.textContent.slice(0, 200));

  // 默认预设是「仅账号字段」，此时 ta.value 应已被替换成干净串
  const ckOut = ckTa.value;
  chk('输入框已替换为整理后的 Cookie 串', ckOut.includes('SESSDATA=') && !ckOut.includes('\t'), ckOut.slice(0, 40));
  chk('整理结果不含 Domain 残留', !ckOut.includes('bilibili.com'));
  chk('默认组合排除了 bmg_af_sc', !ckOut.includes('bmg_af_sc'));
  chk('默认组合保留了 sid（切号必需）', ckOut.split('; ').some(x => x.startsWith('sid=')), ckOut.split('; ').map(x => x.split('=')[0]));
  const ckSess = ckOut.split('; ').find(x => x.startsWith('SESSDATA='));
  // 注意 'SESSDATA=' 是 9 个字符，不是 11
  chk('SESSDATA 值完整(222 字符)', !!ckSess && ckSess.length === 'SESSDATA='.length + 222, ckSess && ckSess.length);
  // 设备字段一律不存：实测对接口无影响，且切号时不该动它们
  chk('默认组合不含设备字段', !/buvid|bili_ticket|b_nut|b_lsid|_uuid/.test(ckOut), ckOut.split('; ').map(x => x.split('=')[0]));
  chk('默认组合只有 5 个身份字段', ckOut.split('; ').length === 5, ckOut.split('; ').map(x => x.split('=')[0]));

  // 宽度回归：文本域必须撑满 section 内区，不能退化成内容宽度
  {
    const secEl = ckTa.closest('.sec');
    const inner = secEl.clientWidth - parseFloat(getComputedStyle(secEl).paddingLeft) - parseFloat(getComputedStyle(secEl).paddingRight);
    // 用 offsetWidth 而不是 getBoundingClientRect：后者会把展开动画的
    // scale(0.98) 一并算进来，动画未结束时读到的宽度是缩放后的假值。
    const w = ckTa.offsetWidth;
    chk('Cookie 文本域撑满可用宽度', Math.abs(w - inner) <= 1, { textarea: w, available: Math.round(inner) });
    chk('文本域宽度大于 260px', ckTa.getBoundingClientRect().width > 260, Math.round(ckTa.getBoundingClientRect().width));
    chk('文本域无横向溢出', ckTa.scrollWidth <= ckTa.clientWidth + 1, { scroll: ckTa.scrollWidth, client: ckTa.clientWidth });
    chk('box-sizing 为 border-box', getComputedStyle(ckTa).boxSizing === 'border-box');
  }

  // 预设从三个减到两个：默认「仅账号字段」，另一档「连设备字段一起存」给保守派

  ckAll.click();

  // 「全部」是给保守派的逃生口：原样保留粘贴到的所有字段，包括与身份无关的

  // 切回默认档
  const ckEss = [...p.querySelectorAll('.seg button')].find(b => b.textContent === '仅账号字段');

  chk('切回默认档又只剩身份字段', !/buvid3=/.test(ckTa.value) && !ckTa.value.includes('bmg_af_sc') && ckTa.value.split('; ').length === 5, ckTa.value.split('; ').map(x => x.split('=')[0]));
  chk('切预设后仍是合法 Cookie 串（无 tab / 无域名）', !ckTa.value.includes('\t') && !ckTa.value.includes('bilibili.com'));

  // ---- 账号池交互：改名 / 借用来源 / 切号 ----
  {
    const poolBtn = (label) => [...poolSec.querySelectorAll('button.act')].find(b => b.textContent === label);

    poolBtn('改名').click();
    await sleep(120);
    const renamed = window.__GM['b.accounts'].accounts[0].label;
    chk('改名写入池子', renamed === '改名后的号', renamed);
    chk('改名后列表刷新', poolSec.textContent.includes('改名后的号'), poolSec.textContent.slice(0, 120));

    chk('已是借用源时不再显示「用它借用」', !poolBtn('用它借用'));
    chk('只有一个账号时不显示切号按钮', !poolBtn('切到此号'));

    // 加第二个账号（直接改池子模拟已导入，再展开面板触发重绘）
    const cur = window.__GM['b.accounts'];
    cur.accounts.push({
      id: 'second00', cookie: 'SESSDATA=c-secret; DedeUserID=777; bili_jct=c-csrf',
      label: '', mid: '777', uname: '副大会员号', vipStatus: 1, vipType: 2, checkedAt: Date.now(), addedAt: Date.now()
    }, {
      id: 'third00', cookie: 'SESSDATA=d-secret; DedeUserID=888; bili_jct=d-csrf',
      label: '', mid: '888', uname: '普通号', vipStatus: 0, vipType: 0, checkedAt: Date.now(), addedAt: Date.now()
    });
    window.GM_setValue('b.accounts', JSON.parse(JSON.stringify(cur)));
    const dot = p.querySelector('.dot');
    dot.click(); await sleep(60);
    dot.click(); await sleep(180);
    chk('第二个账号渲染出来', poolSec.textContent.includes('普通号'), poolSec.textContent.slice(0, 220));
    chk('非会员标记可见', poolSec.textContent.includes('非会员'));

    const useBtns = [...poolSec.querySelectorAll('button.act')].filter(b => b.textContent === '用它借用');
    chk('非借用源有「用它借用」按钮', useBtns.length >= 1, useBtns.length);
    useBtns[0].click();
    await sleep(180);
    chk('手动借用来源已写入', window.__GM['b.accounts'].borrowId === 'second00', window.__GM['b.accounts'].borrowId);

    const autoBtn = [...poolSec.querySelectorAll('button.act')].find(b => b.textContent === '恢复自动' || b.textContent === '自动借用');
    chk('手动模式下有「恢复自动」按钮', !!autoBtn);
    autoBtn.click();
    await sleep(180);
    chk('已恢复自动借用', window.__GM['b.accounts'].borrowId === '', window.__GM['b.accounts'].borrowId);

    // 浏览器当前登录的是 mid=999（=池里第一个号）→ 凭证现成，不必再复制
    {
      const dot = p.querySelector('.dot');
      dot.click(); await sleep(60); dot.click(); await sleep(400);
      const txt = poolSec.textContent;
      chk('认出了浏览器当前登录的号', txt.includes('浏览器当前登录：') && txt.includes('测试会员号'), txt.slice(0, 200));
      chk('没谎称要重新复制（该号已在池中）', !txt.includes('需要从 DevTools 复制'), txt.slice(0, 240));
    }

    // 反过来：浏览器登录的号不在池里，但 document.cookie 能读到 SESSDATA → 应给「一键加入池子」
    {
      document.cookie = 'SESSDATA=auto-import-sess; DedeUserID=555; bili_jct=auto-jct';
      const dot = p.querySelector('.dot');
      dot.click(); await sleep(60); dot.click(); await sleep(600);
      let txt = poolSec.textContent;
      // nav mock 固定返回 mid=999，所以这里直接改池子制造「不在池中」
      chk('读得到 SESSDATA 时不再要求手动复制', !txt.includes('需要从 DevTools 复制'), txt.slice(0, 240));
      chk('认出的号不在池中时不谎称已在池里', txt.includes('浏览器当前登录：'), txt.slice(0, 200));
      document.cookie = 'buvid3=page-dev3; DedeUserID=111';
    }

    // 切号：改写浏览器 Cookie 并刷新页面
    // reload 已在页面加载前被拦下（否则真刷新会清掉 __results）
    const switchBtn = [...poolSec.querySelectorAll('button.act')].find(b => b.textContent === '切到此号');
    chk('非当前账号有「切到此号」按钮', !!switchBtn);
    const reloadBefore = window.__reloadScheduled;
    switchBtn.click();
    await sleep(1700);
    // 切向的是那个非会员号（c-secret），所以浏览器里应该是它的值
    const bc = window.__bcCookies;
    chk('切号把 SESSDATA 写进浏览器', bc.has('SESSDATA') && bc.get('SESSDATA').value === 'c-secret', [...bc.keys()]);
    chk('bili_jct 一起换（不留旧号的）', bc.get('bili_jct') && bc.get('bili_jct').value === 'c-csrf', bc.get('bili_jct'));
    chk('旧号的 sid 被清掉而不是留用', !bc.has('sid'), [...bc.keys()]);
    chk('SESSDATA 写为 HttpOnly', bc.get('SESSDATA').httpOnly === true);
    chk('DedeUserID 不误标 HttpOnly', bc.get('DedeUserID').httpOnly !== true, bc.get('DedeUserID'));
    chk('当前身份已切到新号', window.__GM['b.accounts'].activeId === 'second00', window.__GM['b.accounts'].activeId);
    chk('切号后触发了页面刷新（首屏 SSR 嵌着旧身份，不刷新仍是旧号）', window.__reloadScheduled > reloadBefore, { before: reloadBefore, after: window.__reloadScheduled });
  }
document.getElementById('out').textContent = window.__results.map(r=>(r.ok?'✔ ':'✖ ')+r.n+(r.x?' → '+JSON.stringify(r.x):'')).join('\n');
})();
</script>
